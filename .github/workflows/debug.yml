name: Debug zeus
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @zeppos/zeus-cli
      - run: |
          R=$(npm root -g)/@zeppos/zeus-cli
          ls $R/node_modules/@zeppos/zpm/lib | head -50
          echo --- ; grep -rlE "RESIZE" $R/node_modules/@zeppos --include=*.js 2>/dev/null | head
          echo --- ; grep -rhoE ".{200}default\.r.{200}" $R/node_modules/@zeppos --include=*.js 2>/dev/null | head -5
          echo --- ; grep -rhoE ".{150}\bassets\b.{150}" $R/node_modules/@zeppos/zpm/lib 2>/dev/null | head -12
