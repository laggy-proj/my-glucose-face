name: Debug zeus
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i -g @zeppos/zeus-cli
      - run: |
          R=$(npm root -g)/@zeppos/zeus-cli
          true
          echo ---A; grep -rhoE '.{600}\[t\|\|r\|\|"","raw","default","fonts"\].{1800}' $R/node_modules/@zeppos --include=*.js | head -3
          echo ---B; grep -rhoE '.{300}The icon fi.{200}' $R/node_modules/@zeppos --include=*.js | head -2
