name: Build watchface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install zeus-cli
        run: npm i -g @zeppos/zeus-cli
      - name: Build .zab
        run: zeus build
      - name: Prepare site
        run: |
          mkdir -p _site
          ls -la dist || true
          cp dist/*.zab _site/face.zab
          mkdir -p x && unzip -o -q dist/*.zab -d x
          cp x/*.zpk _site/face.zpk
          mkdir -p _site/wf
          cp x/*.zpk _site/wf/a
          mkdir -p y && unzip -o -q x/*.zpk -d y
          cp y/device.zip _site/device.zip
          cp y/device.zip _site/wf/d
          cp dist/*.zab _site/wf/b
          cat > _site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Watchface QR</title>
          <body style="font-family:system-ui;text-align:center;padding:16px">
          <h1>Scan in Zepp (Developer Mode)</h1>
          <p>Try E, then F, then the others. A QR works only for a short time: scan it right after opening this page.</p>
          <div id="o"></div>
          <script>
          var base = location.host + location.pathname.replace(/[^/]*$/, '');
          [['E: device.zip (try first)','device.zip'],['F: device.zip, no extension','wf/d'],['A: face.zpk','face.zpk'],['B: zpk, no extension','wf/a']].forEach(function (v) {
            var link = 'watchface://' + base + v[1];
            document.getElementById('o').insertAdjacentHTML('beforeend',
              '<h2>' + v[0] + '</h2><p style="word-break:break-all">' + link + '</p><img width="260" height="260" alt="QR" src="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=' + encodeURIComponent(link) + '">');
          });
          </script></body>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
